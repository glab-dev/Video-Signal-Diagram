name: Auto Version Bump

on:
  push:
    branches: ['master', 'main']

permissions:
  contents: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    # Skip if the commit was made by this action (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump patch version
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Bump patch version (no git tag, no commit by npm)
          npm version patch --no-git-tag-version

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update changelog
        run: |
          # Find the last version bump commit
          LAST_BUMP=$(git log --oneline | grep '\[skip ci\]' | head -1 | awk '{print $1}')

          if [ -n "$LAST_BUMP" ]; then
            COMMITS=$(git log --format="%s" "$LAST_BUMP"..HEAD --no-merges | grep -v '\[skip ci\]' || true)
          else
            COMMITS=$(git log --format="%s" -1 HEAD --no-merges)
          fi

          # Write commits to a temp file so Node can read them cleanly
          echo "$COMMITS" > /tmp/commits.txt

          node << 'SCRIPT'
            const fs = require('fs');
            const version = process.env.NEW_VERSION;
            const raw = fs.readFileSync('/tmp/commits.txt', 'utf-8');

            const entries = raw
              .split('\n')
              .map(s => s.trim())
              .filter(s => s.length > 0)
              // Strip conventional commit prefixes
              .map(s => s.replace(/^(feat|fix|chore|refactor|docs|style|perf|test|build|ci):\s*/i, ''))
              // Capitalize first letter
              .map(s => s.charAt(0).toUpperCase() + s.slice(1));

            if (entries.length === 0) {
              console.log('No changelog entries found, skipping update');
              process.exit(0);
            }

            const changelogPath = 'src/changelog.ts';
            let content = fs.readFileSync(changelogPath, 'utf-8');

            // Build the new version entry
            const entriesStr = entries.map(e => {
              const escaped = e.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
              return `    '${escaped}',`;
            }).join('\n');
            const newEntry = `  '${version}': [\n${entriesStr}\n  ],`;

            // Insert after the opening brace of the CHANGELOG object
            content = content.replace(
              "export const CHANGELOG: Record<string, string[]> = {",
              "export const CHANGELOG: Record<string, string[]> = {\n" + newEntry
            );

            fs.writeFileSync(changelogPath, content);
            console.log(`Changelog updated for v${version} with ${entries.length} entries:`);
            entries.forEach(e => console.log(`  - ${e}`));
          SCRIPT

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/changelog.ts
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push
